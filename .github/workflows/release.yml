name: release

# dist-packaging D1 (AC-7): tag push builds the release zip and attaches it
# to the tag's GitHub Release. Runs the same locally-verifiable commands as
# the repo's own gates: the fixture suites + specs validation, then the
# self-verifying reproducible build (build-dist.py).

# Actions are pinned to commit SHAs (scan-fixes Deferred D1, discharged v2.3.4).
# SHAs verified 2026-11-17 via `git ls-remote` against each action's official
# repository (TLS): checkout v4.4.0 = 11d5960a326750d5838078e36cf38b85af677262,
# setup-python v5.6.0 = a26af69be951a213d495a4c3e4e4022e16d87065,
# gh-release v2.6.2 = 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65.
# To upgrade: re-verify the new tag's commit the same way, update both here.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"  # fixed minor (D1 follow-up): reproducible runner env

      - name: Release gates (fixture suites + specs validation)
        run: |
          python scripts/artifact-check.py --fixtures fixtures/
          python scripts/find-skill.py --fixtures fixtures/skills/
          python scripts/artifact-check.py specs/

      - name: Build bundle (self-verifying, reproducible zip)
        run: python scripts/build-dist.py

      - name: Attach zip to the tag's GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/harness-coding-v*.zip

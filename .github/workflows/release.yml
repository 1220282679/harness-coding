name: release

# Two release lanes (dist-packaging AC-9), same gates, no skips:
#
#   v* tag push  -> immutable versioned GitHub Release with the default
#                   reproducible zip (harness-coding-v<version>.zip, the
#                   version read from SKILL.md). This lane is the CHANGELOG-
#                   anchored milestone path; a version bump is its entry fee.
#
#   push to main -> rolling prerelease tagged `latest`: the zip is named
#                   after the commit (--zip-stem harness-coding-main-<sha>)
#                   so no version bump is needed. The previous rolling asset
#                   is deleted and replaced; the release body records the
#                   commit and the zip's sha256. Nothing here is recorded in
#                   CHANGELOG.md -- rolling builds are installs, not versions.
#
# Both lanes run the identical locally-verifiable commands: the fixture
# suites + specs validation + static checks on scripts/ (ruff lint + mypy
# --strict, pinned versions), then the self-verifying reproducible build
# (build-dist.py). A rolling build is never referenced as a version.

# Actions are pinned to commit SHAs (scan-fixes Deferred D1, discharged v2.3.4).
# SHAs verified 2026-11-17 via `git ls-remote` against each action's official
# repository (TLS): checkout v4.4.0 = 11d5960a326750d5838078e36cf38b85af677262,
# setup-python v5.6.0 = a26af69be951a213d495a4c3e4e4022e16d87065,
# gh-release v2.6.2 = 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65.
# To upgrade: re-verify the new tag's commit the same way, update both here.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"  # fixed minor (D1 follow-up): reproducible runner env

      - name: Static checks on scripts/ (lint + type) -- both lanes
        run: |
          pip install --quiet ruff==0.17.5 mypy==2.4.1
          ruff check scripts/ --isolated --select E,F,W,UP,B,SIM,RUF --line-length 120
          mypy --strict scripts/

      - name: Gates (fixture suites + specs validation) -- both lanes
        run: |
          python scripts/artifact-check.py --fixtures fixtures/
          python scripts/find-skill.py --fixtures fixtures/skills/
          python scripts/artifact-check.py specs/

      - name: Build bundle (self-verifying, reproducible zip) -- both lanes
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python scripts/build-dist.py
          else
            python scripts/build-dist.py --zip-stem "harness-coding-main-${GITHUB_SHA::7}"
          fi

      - name: Attach zip to the tag's immutable GitHub Release (v* lane)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/harness-coding-v*.zip

      - name: Replace the rolling 'latest' prerelease (main lane)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          zip="dist/harness-coding-main-${short}.zip"
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease \
              --title "Rolling build (latest)" --notes "placeholder"
          # rolling: only the newest build is kept (the commit is the trace)
          while read -r asset; do
            [ -n "$asset" ] && gh release delete-asset latest "$asset" -y
          done < <(gh release view latest --json assets -q '.assets[].name' | grep '^harness-coding-main-' || true)
          gh release upload latest "$zip" --clobber
          gh release edit latest --notes "$(cat <<EOF
          Rolling build -- auto-replaced on every push to main.

          - commit: ${GITHUB_SHA}
          - zip: harness-coding-main-${short}.zip
          - zip sha256: ${sha}

          Versioned releases (v* tags) are separate, immutable, and
          CHANGELOG-anchored. Rolling builds are installs, not versions.
          EOF
          )"
